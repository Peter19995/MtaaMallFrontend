services:
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.julian-interiors.com/api/v1}
    image: julian-interiors-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - julian-public

networks:
  julian-public:
    external: true
