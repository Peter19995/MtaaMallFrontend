name: Deploy frontend to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtaamall-production-frontend
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --tag "mtaamall-frontend:${GITHUB_SHA}" .

  deploy:
    name: Deploy frontend
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/mtaamall_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mtaamall_deploy" "$HOME/.ssh/known_hosts"

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='coverage' \
            -czf "$RUNNER_TEMP/mtaamall-frontend-${GITHUB_SHA}.tar.gz" .

      - name: Upload and deploy frontend
        env:
          SSH: ssh -i ~/.ssh/mtaamall_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes
          SCP: scp -i ~/.ssh/mtaamall_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes
        run: |
          remote_archive="/home/mtaamall-deploy/uploads/frontend-${GITHUB_SHA}.tar.gz"
          $SSH mtaamall-deploy@109.199.109.99 "mkdir -p /home/mtaamall-deploy/uploads"
          $SCP "$RUNNER_TEMP/mtaamall-frontend-${GITHUB_SHA}.tar.gz" "mtaamall-deploy@109.199.109.99:$remote_archive"
          $SSH mtaamall-deploy@109.199.109.99 \
            "sudo /usr/local/sbin/deploy-mtaamall frontend '$remote_archive' '$GITHUB_SHA'"
