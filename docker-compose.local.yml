services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: mtaamall-frontend-local:latest
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - mtaamall_api

networks:
  mtaamall_api:
    external: true
    name: mtaamallapi_default
